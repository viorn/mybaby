<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сон малыша</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8C%99</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="home">🏠 Главная</button>
      <button class="tab-btn" data-tab="sleep">🌙 Сон</button>
      <button class="tab-btn" data-tab="feeding">🍼 Питание</button>
    </nav>

    <!-- ==================== ГЛАВНАЯ ==================== -->
    <div id="tab-home">
      <!-- Обзор дня -->
      <section class="timer day-section">
        <h2>📊 Обзор дня</h2>
        <div class="day-head">
          <input id="home-day-date" type="date" />
        </div>
        <div class="timeline-wrap">
          <div id="home-timeline" class="timeline"></div>
          <div class="timeline-hours" id="home-hours"></div>
        </div>
        <div class="legend">
          <span><i class="legend-sleep"></i> сон</span>
          <span><i class="legend-feed"></i> кормление</span>
        </div>
        <div id="home-stats" class="day-stats"></div>
      </section>

      <!-- Сон: статус + старт/стоп -->
      <section class="timer">
        <div id="home-status" class="timer-status">Не спит</div>
        <div id="home-last" class="last-sleep hidden"></div>
        <div id="home-elapsed" class="timer-elapsed hidden">00:00</div>
        <button id="home-sleep-btn" class="timer-btn">Начать сон</button>
      </section>

      <!-- Быстрое кормление -->
      <section class="timer">
        <h2>🍼 Кормление</h2>
        <div id="home-feeding-last" class="last-sleep hidden"></div>
        <div class="feeding-form">
          <label>Объём, мл
            <input id="home-feeding-amount" type="number" inputmode="numeric" min="0" step="5" value="60" />
          </label>
          <button id="home-feeding-save" class="timer-btn">Записать</button>
        </div>
        <div class="feeding-hint">Время — сейчас, объём подтягивается из последней записи</div>
      </section>

      <!-- Действия -->
      <section class="home-actions">
        <div class="export-row home-export-dates">
          <label>c <input id="home-export-from" type="date" /></label>
          <label>по <input id="home-export-to" type="date" /></label>
        </div>
        <button id="home-export-csv" class="action-btn">📤 Экспорт CSV</button>
        <button id="home-export-json" class="action-btn">📤 Экспорт JSON</button>
        <button id="home-import-btn" class="action-btn">📥 Импорт JSON</button>
        <input id="home-import-file" type="file" accept=".json,application/json" class="hidden" />
      </section>
    </div>

    <!-- ==================== СОН ==================== -->
    <div id="tab-sleep" class="hidden">
      <!-- Таймер -->
      <section class="timer">
        <div id="timer-status" class="timer-status">Не спит</div>
        <div id="last-sleep" class="last-sleep hidden"></div>
        <div id="timer-elapsed" class="timer-elapsed hidden">00:00</div>
        <button id="timer-btn" class="timer-btn">Начать сон</button>
        <div id="timer-note-wrap" class="hidden">
          <input id="timer-note" type="text" placeholder="Заметка (необязательно)" />
        </div>
      </section>

      <!-- Журнал сна -->
      <section>
        <div class="journal-head">
          <h2>Журнал</h2>
          <button id="add-btn" class="ghost-btn">+ Добавить вручную</button>
        </div>
        <div id="add-form" class="edit-form hidden">
          <label>Начало <input id="add-start" type="datetime-local" /></label>
          <label>Конец <input id="add-end" type="datetime-local" /></label>
          <label>Заметка <input id="add-note" type="text" placeholder="Необязательно" /></label>
          <div class="form-actions">
            <button id="add-save">Сохранить</button>
            <button id="add-cancel" class="ghost-btn">Отмена</button>
          </div>
        </div>
        <ul id="journal"></ul>
      </section>
    </div>

    <!-- ==================== ПИТАНИЕ ==================== -->
    <div id="tab-feeding" class="hidden">
      <!-- Журнал питания -->
      <section>
        <div class="journal-head">
          <h2>Журнал</h2>
          <button id="feeding-add-btn" class="ghost-btn">+ Добавить вручную</button>
        </div>
        <div id="feeding-add-form" class="edit-form hidden">
          <label>Время <input id="feeding-add-at" type="datetime-local" /></label>
          <label>Объём, мл <input id="feeding-add-amount" type="number" inputmode="numeric" min="0" step="5" value="60" /></label>
          <div class="form-actions">
            <button id="feeding-add-save">Сохранить</button>
            <button id="feeding-add-cancel" class="ghost-btn">Отмена</button>
          </div>
        </div>
        <ul id="feeding-journal"></ul>
      </section>
    </div>
  </main>

  <!-- Диалог редактирования сна -->
  <dialog id="edit-dialog">
    <form id="edit-form" method="dialog">
      <h3>Редактировать</h3>
      <label>Начало <input id="edit-start" type="datetime-local" required /></label>
      <label>Конец <input id="edit-end" type="datetime-local" /></label>
      <label>Заметка <input id="edit-note" type="text" /></label>
      <div class="form-actions">
        <button type="submit" id="edit-save">Сохранить</button>
        <button type="button" id="edit-delete" class="danger">Удалить</button>
        <button type="button" id="edit-cancel" class="ghost-btn">Отмена</button>
      </div>
    </form>
  </dialog>

  <!-- Диалог редактирования кормления -->
  <dialog id="feeding-dialog">
    <form id="feeding-edit-form" method="dialog">
      <h3>Редактировать кормление</h3>
      <label>Закончило есть <input id="feeding-edit-at" type="datetime-local" required /></label>
      <label>Объём, мл <input id="feeding-edit-amount" type="number" min="0" step="5" /></label>
      <div class="form-actions">
        <button type="submit" id="feeding-edit-save">Сохранить</button>
        <button type="button" id="feeding-edit-delete" class="danger">Удалить</button>
        <button type="button" id="feeding-edit-cancel" class="ghost-btn">Отмена</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
